<style>
  :root {
    --bg:#E8EEF3; --surface:#FFFFFF; --ink:#1D2B53; --muted:#5B6884; --line:#C6D2DF;
    --ok:#2F6B45; --okbg:#D9EDE0; --again:#8E3358; --againbg:#F3DCE6;
    --warn:#8A6A1A; --warnbg:#F3E6C2;
    --track:#D3DDE8; --gold:#A9772E; --goldbg:#F3E6CF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0F1628; --surface:#19233F; --ink:#EAF0FA; --muted:#9BA9C7; --line:#2B3A5E;
      --ok:#86C99C; --okbg:#1E3A2B; --again:#E9A0BC; --againbg:#40223A;
      --warn:#E3C566; --warnbg:#3D3418;
      --track:#243255; --gold:#E3C07D; --goldbg:#3D3018;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0F1628; --surface:#19233F; --ink:#EAF0FA; --muted:#9BA9C7; --line:#2B3A5E;
    --ok:#86C99C; --okbg:#1E3A2B; --again:#E9A0BC; --againbg:#40223A;
    --warn:#E3C566; --warnbg:#3D3418;
    --track:#243255; --gold:#E3C07D; --goldbg:#3D3018;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 520px; margin: 0 auto; padding: 20px 16px 32px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 14px; }

  .catbar { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 12px; padding-bottom: 2px; }
  .catbar button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: inherit;
    font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 99px; white-space: nowrap; cursor: pointer; }
  .catbar button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 4px;
    background: var(--track); border-radius: 14px; }
  .modes button { font-size: 13px; padding: 10px 4px; }

  .stats { display: flex; flex-direction: column; gap: 18px; }
  .stat-overall { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .stat-overall .pct { font-size: 36px; font-weight: 700; }
  .stat-overall .pct-label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .segbar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; margin-top: 14px; background: var(--track); }
  .progress .segbar { margin-top: 0; height: 8px; }
  .segbar i { display: block; height: 100%; }
  .seg-red { background: var(--again); }
  .seg-yellow { background: var(--warn); }
  .seg-green { background: var(--ok); }
  .legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 99px; display: inline-block; }
  .stat-cats { display: flex; flex-direction: column; gap: 12px; }
  .stat-row { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .stat-row .top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .stat-row .top b { font-weight: 600; }
  .stat-row .top span { color: var(--muted); font-size: 12px; }
  .stat-row .segbar { margin-top: 0; height: 8px; }
  .modes button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px;
    font-weight: 500; padding: 10px 6px; border-radius: 10px; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; }
  button:focus-visible, .card:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .progress { margin: 18px 2px 14px; }
  .bar { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s ease; }
  .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 8px; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
    min-height: min(50vh, 380px); padding: 24px 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    cursor: pointer; user-select: none; -webkit-user-select: none; position: relative;
  }
  .card.turn { animation: turn .28s ease; }
  @keyframes turn { from { transform: rotateY(75deg); opacity: .3; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .card.turn { animation: none; } .bar > i { transition: none; } }

  .stagepip { position: absolute; top: 14px; right: 16px; font-size: 12px; font-weight: 700; color: var(--gold);
    background: var(--goldbg); padding: 4px 10px; border-radius: 99px; }

  .kanji { font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    font-weight: 700; font-size: clamp(56px, 20vw, 96px); line-height: 1.2; }
  .kanji.sm { font-size: clamp(40px, 13vw, 60px); }
  .read { font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    font-size: 24px; color: var(--muted); margin-top: 6px; }
  .romaji { font-size: 14px; font-style: italic; color: var(--muted); opacity: .75; margin-top: 2px; }
  .fr { font-size: clamp(30px, 9vw, 44px); font-weight: 700; line-height: 1.2; }
  .hint { color: var(--muted); font-size: 14px; margin-top: 22px; }
  .sep { width: 48px; height: 1px; background: var(--line); margin: 18px 0; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .btn { border: 0; font: inherit; font-size: 17px; font-weight: 700; padding: 16px; border-radius: 16px; cursor: pointer; }
  .btn.again { background: var(--againbg); color: var(--again); }
  .btn.know { background: var(--okbg); color: var(--ok); }
  .btn.flip, .btn.next { grid-column: 1 / -1; background: var(--ink); color: var(--bg); }

  .choices { display: grid; gap: 8px; width: 100%; margin-top: 22px; }
  .choice { border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 17px;
    font-weight: 500; padding: 14px; border-radius: 14px; cursor: pointer; }
  .choice.right { background: var(--okbg); border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .choice.wrong { background: var(--againbg); border-color: var(--again); color: var(--again); }
  .choice:disabled { cursor: default; }

  .opts { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between;
    font-size: 14px; color: var(--muted); align-items: center; }
  .opts label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .linkbtn { background: none; border: 0; padding: 6px 0; font: inherit; font-size: 14px; color: var(--muted);
    text-decoration: underline; cursor: pointer; }

  .done { text-align: center; padding: 8px 0; }
  .done .kanji { font-size: 64px; }
  .done p { color: var(--muted); margin: 8px 0 0; }
  .done .actions { margin-top: 22px; }
</style>
</head>
<body>
<main class="app">
  <h1>Verbes usuels — japonais</h1>
  <div class="catbar" id="catbar"></div>
  <div class="modes" id="modes">
    <button data-mode="jp2fr" aria-pressed="true">日 → FR</button>
    <button data-mode="fr2jp" aria-pressed="false">FR → 日</button>
    <button data-mode="quiz" aria-pressed="false">Quiz</button>
    <button data-mode="stats" aria-pressed="false">Stats</button>
  </div>

  <div class="progress">
    <div class="segbar"><i class="seg-red" id="segRed"></i><i class="seg-yellow" id="segYellow"></i><i class="seg-green" id="segGreen"></i></div>
    <div class="meta"><span id="known"></span><span id="left"></span></div>
  </div>

  <div id="stage"></div>

  <div class="opts" id="opts">
    <label id="readLabel"><input type="checkbox" id="showRomaji"> Afficher le romaji</label>
    <button class="linkbtn" id="reset">Tout remettre à zéro</button>
  </div>
</main>

// --- Système de répétition espacée (paliers de type Leitner, avec vraies dates) ---
// palier 0 = nouveau/à revoir aujourd'hui, palier 5 = maîtrisé
const INTERVAL_DAYS = [0, 0, 1, 3, 7, 16];
const STORE_KEY = 'verbes-jp-srs-v2';
const OLD_KEY = 'verbes-jp-known-v1';
const DAY = 86400000;

let srs = {}; // { word: { stage, next(ms) } }
let mode = 'jp2fr', activeCat = 'Toutes';
let queue = [], flipped = false, showRomaji = false;
let answered = null, options = [], animate = false;

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cats = () => [...new Set(V.map(v => v.cat))];
const wordsInCat = () => activeCat === 'Toutes' ? V.map((_, i) => i) : V.map((_, i) => i).filter(i => V[i].cat === activeCat);

function ensure(i) { const w = V[i].w; if (!srs[w]) srs[w] = { stage: 0, next: 0 }; return srs[w]; }

function loadSRS() {
  try {
    const s = localStorage.getItem(STORE_KEY);
    if (s) { srs = JSON.parse(s); return; }
  } catch (e) {}
  // migration depuis l'ancienne version (simple "sus / pas sus")
  try {
    const old = localStorage.getItem(OLD_KEY);
    if (old) {
      const oldKnown = new Set(JSON.parse(old));
      V.forEach((v, i) => { srs[v.w] = { stage: oldKnown.has(i) ? 3 : 0, next: 0 }; });
      saveSRS();
    }
  } catch (e) {}
}
function saveSRS() { try { localStorage.setItem(STORE_KEY, JSON.stringify(srs)); } catch (e) {} }

function isDue(i) { return ensure(i).next <= Date.now(); }
function markCorrect(i) {
  const s = ensure(i);
  s.stage = Math.min(s.stage + 1, 5);
  s.next = Date.now() + INTERVAL_DAYS[s.stage] * DAY;
  saveSRS();
}
function markWrong(i) {
  const s = ensure(i);
  s.stage = 0;
  s.next = Date.now();
  saveSRS();
}
function stageLabel(i) {
  const s = ensure(i).stage;
  return s >= 5 ? 'maîtrisé' : s === 0 ? 'nouveau' : 'palier ' + s;
}

function startSession(forceAll) {
  const pool = wordsInCat();
  queue = shuffle(forceAll ? pool : pool.filter(isDue));
  flipped = false; answered = null; buildOptions(); render();
}
function buildOptions() {
  if (!queue.length) return;
  const cur = queue[0];
  const pool = wordsInCat().filter(i => i !== cur);
  const others = shuffle(pool.length >= 3 ? pool : V.map((_, i) => i).filter(i => i !== cur)).slice(0, 3);
  options = shuffle([cur, ...others]);
}
function reinsert() { const c = queue.shift(); queue.splice(Math.min(3, queue.length), 0, c); }
function reading(v) { return v.r || ''; }
function romajiOf(v) { return v.rj || ''; }
function readBlock(v) {
  let h = '';
  if (reading(v)) h += '<div class="read">' + reading(v) + '</div>';
  if (showRomaji && romajiOf(v)) h += '<div class="romaji">' + romajiOf(v) + '</div>';
  return h;
}

function renderCatbar() {
  const list = cats();
  const bar = $('catbar');
  if (list.length <= 1) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
  bar.style.display = 'flex';
  const all = ['Toutes', ...list];
  bar.innerHTML = all.map(c => '<button data-cat="' + c + '" aria-pressed="' + (c === activeCat) + '">' + c + '</button>').join('');
  bar.querySelectorAll('button').forEach(b => b.onclick = () => { activeCat = b.dataset.cat; startSession(false); });
}

function bucket(stage) { return stage === 0 ? 'red' : stage <= 3 ? 'yellow' : 'green'; }
function statsFor(indices) {
  const r = { red: 0, yellow: 0, green: 0, total: indices.length };
  indices.forEach(i => { r[bucket(ensure(i).stage)]++; });
  return r;
}
function segbarHTML(s) {
  const pct = k => s.total ? (s[k] / s.total * 100) : 0;
  return '<div class="segbar"><i class="seg-red" style="width:' + pct('red') + '%"></i>' +
    '<i class="seg-yellow" style="width:' + pct('yellow') + '%"></i>' +
    '<i class="seg-green" style="width:' + pct('green') + '%"></i></div>';
}
function renderStats() {
  const st = $('stage');
  const all = V.map((_, i) => i);
  const overall = statsFor(all);
  const pctGreen = overall.total ? Math.round(overall.green / overall.total * 100) : 0;
  let h = '<div class="stats">';
  h += '<div class="stat-overall"><div class="pct">' + pctGreen + '%</div><div class="pct-label">maîtrisé sur ' + overall.total + ' mots au total</div>' +
    segbarHTML(overall) +
    '<div class="legend"><span><i style="background:var(--again)"></i>' + overall.red + ' pas encore su</span>' +
    '<span><i style="background:var(--warn)"></i>' + overall.yellow + ' en cours</span>' +
    '<span><i style="background:var(--ok)"></i>' + overall.green + ' maîtrisé</span></div></div>';
  h += '<div class="stat-cats">';
  cats().forEach(c => {
    const idx = V.map((_, i) => i).filter(i => V[i].cat === c);
    const s = statsFor(idx);
    const p = s.total ? Math.round(s.green / s.total * 100) : 0;
    h += '<div class="stat-row"><div class="top"><b>' + c + '</b><span>' + p + '% · ' + s.total + ' mots</span></div>' + segbarHTML(s) + '</div>';
  });
  h += '</div></div>';
  st.innerHTML = h;
}

function render() {
  const isStats = mode === 'stats';
  document.querySelector('.progress').style.display = isStats ? 'none' : '';
  if (isStats) { $('catbar').style.display = 'none'; } else { renderCatbar(); }
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  if (isStats) { renderStats(); return; }

  const pool = wordsInCat();
  const s = statsFor(pool);
  const pct = k => s.total ? (s[k] / s.total * 100) : 0;
  $('segRed').style.width = pct('red') + '%';
  $('segYellow').style.width = pct('yellow') + '%';
  $('segGreen').style.width = pct('green') + '%';
  $('known').textContent = s.green + ' maîtrisé' + (s.green > 1 ? 's' : '') + ' · ' + s.yellow + ' en cours · ' + s.red + ' à démarrer';
  $('left').textContent = queue.length ? queue.length + (queue.length > 1 ? ' cartes à revoir' : ' carte à revoir') : '';

  const st = $('stage');
  if (!queue.length) {
    const remaining = s.total - s.green;
    st.innerHTML = '<div class="card done" style="cursor:default"><div class="kanji">' + (remaining ? '頑張って' : 'よくできました') + '</div>' +
      '<p>' + (remaining ? 'Bien joué — ' + s.yellow + ' mot(s) en cours d\'apprentissage, ' + s.green + ' maîtrisé(s). Reviens dans quelques jours : les mots reconnus reviendront automatiquement pour se fixer en mémoire durable.' : 'Tous les mots de cette sélection sont maîtrisés !') + '</p></div>' +
      '<div class="actions"><button class="btn know" id="all" style="grid-column:1/-1">Tout repasser en revue quand même</button></div>';
    $('all').onclick = () => startSession(true);
    return;
  }
  const v = V[queue[0]];
  const cls = 'card' + (animate ? ' turn' : '');
  animate = false;

  if (mode === 'quiz') {
    let h = '<div class="' + cls + '" style="cursor:default"><span class="stagepip">' + stageLabel(queue[0]) + '</span><div class="kanji">' + v.w + '</div>';
    if (answered !== null) h += (reading(v) ? '<div class="read">' + reading(v) + '</div>' : '<div class="read">&nbsp;</div>') + (showRomaji && romajiOf(v) ? '<div class="romaji">' + romajiOf(v) + '</div>' : '');
    h += '<div class="choices">';
    options.forEach(i => {
      let c = 'choice';
      if (answered !== null) { if (i === queue[0]) c += ' right'; else if (i === answered) c += ' wrong'; }
      h += '<button class="' + c + '" data-i="' + i + '" ' + (answered !== null ? 'disabled' : '') + '>' + V[i].f + '</button>';
    });
    h += '</div></div>';
    if (answered !== null) h += '<div class="actions"><button class="btn next" id="next">Suivant</button></div>';
    st.innerHTML = h;
    st.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      const i = +b.dataset.i; answered = i;
      if (i === queue[0]) markCorrect(queue[0]); else markWrong(queue[0]);
      render();
    });
    if ($('next')) $('next').onclick = () => {
      if (answered === queue[0]) queue.shift(); else reinsert();
      answered = null; buildOptions(); render();
    };
    return;
  }

  let face = '';
  if (mode === 'jp2fr') {
    face = !flipped
      ? '<span class="stagepip">' + stageLabel(queue[0]) + '</span><div class="kanji">' + v.w + '</div>' + readBlock(v) + '<div class="hint">Touche pour retourner</div>'
      : '<span class="stagepip">' + stageLabel(queue[0]) + '</span><div class="kanji sm">' + v.w + '</div>' + readBlock(v) + '<div class="sep"></div><div class="fr">' + v.f + '</div>';
  } else {
    face = !flipped
      ? '<span class="stagepip">' + stageLabel(queue[0]) + '</span><div class="fr">' + v.f + '</div><div class="hint">Dis le mot japonais à voix haute, puis retourne</div>'
      : '<span class="stagepip">' + stageLabel(queue[0]) + '</span><div class="kanji">' + v.w + '</div>' + readBlock(v) + '<div class="sep"></div><div class="fr" style="font-size:22px;color:var(--muted);font-weight:500">' + v.f + '</div>';
  }
  st.innerHTML = '<div class="' + cls + '" id="card" tabindex="0" role="button" aria-label="Retourner la carte">' + face + '</div>' +
    '<div class="actions">' + (flipped
      ? '<button class="btn again" id="again">Je ne savais pas</button><button class="btn know" id="know">Je savais</button>'
      : '<button class="btn flip" id="flip">Retourner</button>') + '</div>';
  $('card').onclick = flip;
  if ($('flip')) $('flip').onclick = flip;
  if ($('again')) $('again').onclick = () => { markWrong(queue[0]); reinsert(); flipped = false; render(); };
  if ($('know')) $('know').onclick = () => {
    markCorrect(queue[0]);
    if (isDue(queue[0])) reinsert(); else queue.shift();
    flipped = false; render();
  };
}
function flip() { flipped = !flipped; animate = true; render(); }

document.querySelectorAll('#modes button').forEach(b => b.onclick = () => { mode = b.dataset.mode; flipped = false; answered = null; buildOptions(); render(); });
$('showRomaji').onchange = e => { showRomaji = e.target.checked; render(); };
$('reset').onclick = () => { srs = {}; saveSRS(); startSession(true); };
document.addEventListener('keydown', e => {
  if (mode === 'quiz' || !queue.length) return;
  if (e.key === ' ' || e.key === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; e.preventDefault(); flip(); }
  else if (flipped && e.key === 'ArrowLeft') { $('again').click(); }
  else if (flipped && e.key === 'ArrowRight') { $('know').click(); }
});

loadSRS();
renderCatbar();
startSession(false);
</script>
</body>
</html>
